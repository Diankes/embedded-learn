<style>
/* Layout: one 680px column, a solder-mask header, puzzles as cards on a pale board; gold = you, violet = your ghost. */

  --good: #23824a; --good-soft: #dcf0e3; --bad: #bd3b28; --bad-soft: #f8e0db; --ghost: #6c5bd3; --ghost-soft: #e6e2fb;

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --mask: #143d2d; --mask-ink: #e3eee7; --gold: #dcb05a; --gold-soft: #3a2f16;

  --code: #06100c; --code-ink: #cfe6d6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a1712; --panel: #0f241b; --ink: #e3eee7; --muted: #8ba596; --line: #1f3b2e;
  --mask: #143d2d; --mask-ink: #e3eee7; --gold: #dcb05a; --gold-soft: #3a2f16;
  --good: #52c07a; --good-soft: #143322; --bad: #f0705a; --bad-soft: #3a1a14; --ghost: #a497ff; --ghost-soft: #251f45;
  --code: #06100c; --code-ink: #cfe6d6; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--mask) }

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

  padding: 6px 10px; border-radius: 6px; opacity: .75 }

.day i { display: block; height: 26px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); margin-bottom: 4px }

.lrow .score { font: 700 18px var(--display); font-variant-numeric: tabular-nums; text-align: right }

.concept:first-of-type { border-top: none }
.chart { width: 100%; height: 150px; display: block }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%); z-index: 20; background: var(--panel); border: 2px solid var(--gold);
  border-radius: 14px; padding: 18px 22px; text-align: center; box-shadow: 0 10px 40px rgb(0 0 0 / .25); animation: pop .5s cubic-bezier(.2,1.4,.4,1) }
@keyframes pop { from { transform: translateX(-50%) scale(.7); opacity: 0 } }

@keyframes fok { 30% { box-shadow: 0 0 0 4px var(--good) } }
@keyframes fno { 20%, 60% { transform: translateX(-5px) } 40%, 80% { transform: translateX(5px) } }
.lives { display: flex; gap: 4px } .lives i { width: 14px; height: 14px; border-radius: 3px; background: var(--bad) } .lives i.lost { background: var(--line) }
.note { font-size: 13px; color: var(--muted); margin: 0 }
.claude { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 14px }
@media (max-width: 480px) { .hud { grid-template-columns: repeat(2, 1fr) } .big { font-size: 38px } .concept { grid-template-columns: 1fr 60px 44px auto } nav a { padding: 6px 7px } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }

<header><div class="bar">
  <div class="brand"><span id="hdrEmblem"></span>C6 Tactics <small id="hdrRating"></small></div>
  <nav>
    <a href="#play">Play</a><a href="#rush">Rush</a><a href="#ladder">Ladder</a><a href="#stats">Stats</a>
  </nav>
</div></header>
<main id="app">
  <div class="card"><p class="q">Loading 746 puzzles, all checked by the real ESP toolchain…</p></div>
</main>

<script>
"use strict";
// ---------------------------------------------------------------------------------------------------------------
// C6 Tactics. Puzzles are opponents with ratings (like chess tactics); you get a Glicko-2 rating against them.
// The next puzzle is picked the way X's For You feed ranks posts (xai-org/x-algorithm, home-mixer): predict how
// each candidate will go, score = weighted sum, then diversity decay, an "out-of-network" discount and a new-item
// boost. Here the prediction is your chance to solve it, and the target is learning, not time spent.
// ---------------------------------------------------------------------------------------------------------------
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (k === "style") e.style.cssText = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids) { const e = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); e.append(...kids); return e; }

// ---- ranks ------------------------------------------------------------------------------------------------------
const TIERS = [["Bit", 0, "#8c6a4c"], ["Nibble", 800, "#8f9aa1"], ["Byte", 1000, "#c08a35"], ["Word", 1200, "#3d97c2"],
  ["Register", 1400, "#2fa774"], ["Bus Master", 1600, "#8a68dc"], ["Kernel", 1800, "#d9506f"], ["Silicon", 2000, "#e9b93c"]];
function tierOf(r) {
  let i = 0; while (i + 1 < TIERS.length && r >= TIERS[i + 1][1]) i++;
  const lo = TIERS[i][1], hi = i + 1 < TIERS.length ? TIERS[i + 1][1] : null;
  if (hi == null) return { i, name: TIERS[i][0], div: "", color: TIERS[i][2], next: null, frac: 1 };
  const span = (hi - lo) / 3, d = Math.min(2, Math.floor((r - lo) / span));
  const nextAt = lo + span * (d + 1);
  return { i, name: TIERS[i][0], div: ["III", "II", "I"][d], color: TIERS[i][2], next: Math.ceil(nextAt), frac: (r - (lo + span * d)) / span,
    nextName: d < 2 ? `${TIERS[i][0]} ${["III", "II", "I"][d + 1]}` : `${TIERS[i + 1][0]} III` };
}
function emblem(r, size = 30) {   // a chip package: more pins per side as you climb
  const t = tierOf(r), pins = 1 + Math.min(3, Math.floor(t.i / 2)), g = s("svg", { width: size, height: size, viewBox: "0 0 40 40", "aria-hidden": "true" });
  for (let k = 0; k < pins; k++) {
    const p = 8 + (24 / (pins + 1)) * (k + 1) - 1.5;
    for (const [x, y, w, hh] of [[p, 2, 3, 6], [p, 32, 3, 6], [2, p, 6, 3], [32, p, 6, 3]]) g.append(s("rect", { x, y, width: w, height: hh, rx: 1, fill: "#c9a24a" }));
  }
  g.append(s("rect", { x: 7, y: 7, width: 26, height: 26, rx: 4, fill: t.color }));
  g.append(s("circle", { cx: 12.5, cy: 12.5, r: 2, fill: "rgb(255 255 255 / .55)" }));
  g.append(s("text", { x: 20, y: 25, "text-anchor": "middle", "font-family": "Chakra Petch, sans-serif", "font-weight": 700, "font-size": 11, fill: "#fff" }, t.div || "★"));
  return g;
}

// ---- Glicko-2 (one puzzle = one game, like lichess puzzles) -----------------------------------------------------
const Q = 173.7178, TAU = 0.5, PUZZLE_RD = 80;
function expect(r, rd, pr) { const pj = PUZZLE_RD / Q, g = 1 / Math.sqrt(1 + 3 * pj * pj / Math.PI ** 2); return 1 / (1 + Math.exp(-g * ((r - pr) / Q))); }
function glicko(p, oppR, score) {
  const mu = (p.r - 1500) / Q, phi = p.rd / Q, mj = (oppR - 1500) / Q, pj = PUZZLE_RD / Q;
  const g = 1 / Math.sqrt(1 + 3 * pj * pj / Math.PI ** 2), E = 1 / (1 + Math.exp(-g * (mu - mj)));
  const v = 1 / (g * g * E * (1 - E)), d = v * g * (score - E), a = Math.log(p.vol * p.vol);
  const f = (x) => { const ex = Math.exp(x); return ex * (d * d - phi * phi - v - ex) / (2 * (phi * phi + v + ex) ** 2) - (x - a) / (TAU * TAU); };
  let A = a, B;
  if (d * d > phi * phi + v) B = Math.log(d * d - phi * phi - v); else { let k = 1; while (f(a - k * TAU) < 0 && k < 50) k++; B = a - k * TAU; }
  let fA = f(A), fB = f(B);
  for (let it = 0; Math.abs(B - A) > 1e-6 && it < 100; it++) { const C = A + (A - B) * fA / (fB - fA), fC = f(C); if (fC * fB <= 0) { A = B; fA = fB; } else fA /= 2; B = C; fB = fC; }
  const vol = Math.min(0.09, Math.exp(A / 2)), ps = Math.sqrt(phi * phi + vol * vol), np = 1 / Math.sqrt(1 / (ps * ps) + 1 / v);
  return { r: Math.max(400, (mu + np * np * g * (score - E)) * Q + 1500), rd: Math.max(75, Math.min(350, np * Q)), vol };
}

// ---- dates --------------------------------------------------------------------------------------------------------
const pad = (n) => String(n).padStart(2, "0");
const dstr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const dayNum = (str) => Math.round(new Date(str + "T12:00:00").getTime() / 864e5);
const addDays = (str, n) => { const d = new Date(str + "T12:00:00"); d.setDate(d.getDate() + n); return dstr(d); };
function weekId(str) { const d = new Date(str + "T12:00:00"), day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day + 3);
  const y = d.getFullYear(), jan4 = new Date(y, 0, 4); return `${y}-W${pad(1 + Math.round(((d - jan4) / 864e5 - 3 + ((jan4.getDay() + 6) % 7)) / 7))}`; }
const GOAL = 900;   // seconds of play a day: the streak counts days that reach it
const fmtTime = (sec) => `${Math.floor(sec / 60)}:${pad(Math.floor(sec % 60))}`;

// ---- state + storage ---------------------------------------------------------------------------------------------
let PZ = [], BYID = {}, META = {}, LAB = 1;
let P = null;              // this player's document
let UID = null, DB = null, USER = null, SAMPLE = null, others = {};
const LS = "c6tactics.player";
function newPlayer() { return { v: 1, r: 1000, rd: 350, vol: 0.06, xp: 0, solved: 0, tried: 0, streak: 0, last: null, days: {}, hist: [], wk: {},
  rush: { best: 0, tl: [], at: null }, best: null, sess: [], cc: {}, seen: {}, cards: {}, neg: {}, flags: {}, upd: 0 }; }
let writing = Promise.resolve(), dirty = false;
function save() {
  P.upd = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(P)); } catch {}
  if (!DB || !UID) return;
  if (dirty) return; dirty = true;   // coalesce: one write in flight per document, the latest state wins
  writing = writing.then(async () => { dirty = false; try { await DB.doc("players/" + UID).set(JSON.parse(JSON.stringify(P))); } catch (e) { console.warn("save failed", e); } });
}
function prune() {
  const keep = (obj, n) => { const ks = Object.keys(obj).sort(); for (const k of ks.slice(0, Math.max(0, ks.length - n))) delete obj[k]; };
  keep(P.days, 70); keep(P.wk, 16); if (P.hist.length > 400) P.hist = P.hist.slice(-400); if (P.sess.length > 12) P.sess = P.sess.slice(-12);
}

// ---- the picker (X's For You ranking, retargeted at learning) --------------------------------------------------------
// X: Final Score = Σ weight_i × P(action_i), then author-diversity decay (down to a floor), an out-of-network discount
// and a new-author boost, then a diversity reranker. Ours, per candidate puzzle:
//   learn   how close your solve chance is to the sweet spot (70%: hard enough to teach, easy enough to keep going)
//   due     its concept has a review card due (you missed it before; spaced repetition)
//   fresh   a concept you have never seen, lifted into the feed every ~6 puzzles (X's new-author boost)
//   rematch a puzzle you missed, back after two days
// × track: concepts of your current lab 1.0, earlier labs 0.8, later labs 0.6 if you'd likely solve it, else 0.25
// × diversity: 0.55 per same-concept puzzle in the last 3, floor 0.3 (X: author diversity decay)
// × your "too easy / confusing" feedback on that concept (X's "not interested" carries a weight of -53)
function pickNext(sess) {
  const d = today(), dn = dayNum(d), recent = sess.ids.slice(-3).map((id) => BYID[id].c);
  const sinceNew = sess.ids.length - (sess.lastNew ?? -99), tilt = sess.results.slice(-2).length === 2 && sess.results.slice(-2).every((x) => !x);
  const target = tilt ? 0.85 : 0.7, scored = [];
  for (const p of PZ) {
    if (sess.focus && p.c !== sess.focus) continue;
    if (sess.ids.includes(p.id)) continue;
    const seen = P.seen[p.id], rematch = seen && !seen[0] && dn - seen[1] >= 2;
    if (seen && seen[0] && dn - seen[1] < 21) continue;                  // solved: hidden for three weeks
    if (seen && !seen[0] && !rematch) continue;
    const ps = expect(P.r, P.rd, p.r);
    let score = Math.exp(-((ps - target) ** 2) / (2 * 0.12 ** 2));
    const card = P.cards[p.c], due = card && card[1] <= dn;
    const fresh = !P.cc[p.c];
    if (due) score += 0.6;
    if (fresh) score += sinceNew >= 6 ? 0.8 : -0.2;
    if (rematch) score += 0.4;
    score *= p.lab === LAB ? 1 : p.lab < LAB ? 0.8 : ps > 0.55 ? 0.6 : 0.25;
    const same = recent.filter((c) => c === p.c).length;
    score *= Math.max(0.3, 0.55 ** same);
    score *= 0.75 ** (P.neg[p.c] || 0);
    score *= 0.9 + 0.2 * Math.random();
    const why = rematch ? "Rematch" : due ? "Review due" : fresh ? "New concept" : p.lab > LAB ? `Preview · Lab ${p.lab}` : p.lab < LAB ? "Review" : `Lab ${p.lab}`;
    scored.push({ p, score, why });
  }
  if (!scored.length) return null;
  scored.sort((a, b) => b.score - a.score);
  const top = scored.slice(0, 6), w = top.map((x) => x.score ** 3), tot = w.reduce((a, b) => a + b, 0);
  let k = Math.random() * tot; for (let i = 0; i < top.length; i++) { k -= w[i]; if (k <= 0) return top[i]; }
  return top[0];
}

// ---- answers --------------------------------------------------------------------------------------------------------
function parseNum(str, fmt) {
  let t = str.trim().toLowerCase().replace(/[_\s]/g, "");
  if (!t) return null;
  let neg = false; if (t.startsWith("-")) { neg = true; t = t.slice(1); }
  let v;

      h("button", { onclick: () => { SESS = null; location.hash = "play"; render(); } }, "Home")))];
}

// ---- PUZZLE RUSH (5 minutes, 3 strikes, rising difficulty, against your best run) ---------------------------------------
function startRush() {
  RUSH = { start: Date.now(), paused: 0, pauseAt: null, ids: [], score: 0, strikes: 0, done: false, misses: [], cur: null, tl: [] };
  nextRush(); render();
}
function nextRush() {
  const R = RUSH, target = 600 + 45 * R.score + 25 * R.strikes;
  const pool = PZ.filter((p) => !R.ids.includes(p.id) && Math.abs(p.r - target) < (p.k === "pick" ? 90 : 60) && (p.k === "pick" || p.fmt));
  const p = pool.length ? pool[Math.floor(Math.random() * pool.length)] : PZ.filter((x) => !R.ids.includes(x.id)).sort((a, b) => Math.abs(a.r - target) - Math.abs(b.r - target))[0];
  R.ids.push(p.id); R.cur = { p, t0: Date.now(), answered: null, picked: null, why: null };
}
function rushAnswer(ok, picked) {
  const R = RUSH; if (!R || R.done || R.cur.answered) return;
  record(R.cur.p, ok, (Date.now() - R.cur.t0) / 1000, "rush");
  beep(ok);
  if (ok) { R.score++; R.tl.push(Math.round(elapsed(R))); addXp(3); } else { R.strikes++; R.misses.push({ p: R.cur.p, picked }); addXp(1); }
  save();
  if (R.strikes >= 3) return finishRush();
  nextRush(); render();
}
function finishRush() {
  const R = RUSH; if (!R || R.done) return; R.done = true;
  R.prev = P.rush.best;
  if (R.score > P.rush.best) P.rush = { best: R.score, tl: R.tl, at: today() };
  save(); render();
}
function rushPbText(R, el) {
  if (!P.rush.best) return "First run: it sets your personal best.";
  const pace = P.rush.tl.filter((t) => t <= el).length, d = R.score - pace;
  return `Best run (${P.rush.best}) had ${pace} by now: ${d > 0 ? `you're ${d} ahead` : d < 0 ? `you're ${-d} behind` : "level"}.`;
}
function renderRush() {
  const R = RUSH;
  if (!R) {
    const board = rushBoard();
    return [h("div", { class: "card", style: "display:grid;gap:12px" },
      h("div", { class: "mid", text: "Puzzle Rush" }),
      h("p", { class: "note", text: "5 minutes. Puzzles start easy and get harder with every solve. Three mistakes and it's over. Your best run races you." }),
      h("div", { class: "row" }, h("button", { class: "primary", onclick: startRush }, "Start Rush"), h("span", { class: "note", text: P.rush.best ? `Personal best: ${P.rush.best}` : "No best yet" }))),
      h("h2", { text: "Best runs" }), board];
  }
  if (R.done) {
    return [h("div", { class: "card", style: "display:grid;gap:12px;text-align:center;justify-items:center" },
      h("div", { class: "muted", style: "font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase", text: "Rush over" }),
      h("div", { class: "big num", text: R.score }),
      h("div", { class: "mid", style: `color:${R.score > R.prev ? "var(--gold)" : "var(--ghost)"}`, text: R.score > R.prev ? (R.prev ? `New best! (was ${R.prev})` : "Your first best") : `Best is still ${R.prev}` }),
      h("div", { class: "row", style: "justify-content:center" }, h("button", { class: "primary", onclick: startRush }, "Again"), h("button", { onclick: () => { RUSH = null; render(); } }, "Back"))),
      R.misses.length ? h("h2", { text: "Your misses" }) : null,
      ...R.misses.map(({ p }) => h("div", { class: "card", style: "display:grid;gap:8px" }, h("p", { class: "q", text: p.q }), p.code ? h("pre", { class: "code", text: p.code }) : null,
        h("div", {}, h("span", { class: "muted", text: "Answer: " }), h("code", { style: "font:600 15px var(--mono);white-space:pre-wrap", text: answerText(p) })), h("ul", { class: "why" }, (p.why || []).slice(0, 2).map((t) => h("li", { text: t })))))];
  }
  const el = elapsed(R);
  return [h("div", { class: "hud" },
    h("div", {}, h("small", { text: "Time left" }), h("b", { id: "clock", text: fmtTime(Math.max(0, 300 - el)) })),
    h("div", {}, h("small", { text: "Solved" }), h("b", { text: R.score })),
    h("div", {}, h("small", { text: "Lives" }), h("div", { class: "lives", style: "margin-top:6px" }, [0, 1, 2].map((i) => h("i", { class: i < R.strikes ? "lost" : "" })))),
    h("div", {}, h("small", { text: "Best" }), h("b", { text: P.rush.best || "–" }))),
    h("p", { class: "note", id: "pbNote", text: rushPbText(R, el) }),
    ...renderPuzzle(R.cur, "rush")];
}
function rushBoard() {
  const rows = allPlayers().filter((x) => x.doc.rush && x.doc.rush.best).sort((a, b) => b.doc.rush.best - a.doc.rush.best);
  if (!rows.length) return h("p", { class: "note", text: "No runs yet." });
  return h("div", { class: "card ladder" }, rows.map((x, i) => lrow(i + 1, x.doc.r, x.name, x.doc.rush.at ? `on ${x.doc.rush.at}` : "", x.doc.rush.best, x.me, false)));
}

// ---- LADDER --------------------------------------------------------------------------------------------------------------
let NAMES = {};
function allPlayers() {
  const list = Object.entries(others).filter(([id]) => id !== UID).map(([id, doc]) => ({ id, doc, name: NAMES[id] || "Someone", me: false }));
  list.push({ id: UID || "me", doc: P, name: "You", me: true });
  return list;
}
function lrow(pos, r, name, sub, score, me, ghost) {
  return h("div", { class: "lrow" + (me ? " me" : "") + (ghost ? " gh" : "") }, h("span", { class: "pos", text: pos }), emblem(r, 30),
    h("span", { class: "who" }, name, h("small", { text: sub })), h("span", { class: "score", text: score }));
}
function renderLadder() {
  const d = today(), rows = allPlayers().map((x) => ({ r: x.doc.r, name: x.name, sub: `${tierOf(x.doc.r).name} ${tierOf(x.doc.r).div} · ${x.doc.solved} solved`, me: x.me, ghost: false }));
  const at = (k) => { let r = null; for (const [day, v] of P.hist) if (day <= k) r = v; return r; };
  const g7 = at(addDays(d, -7)), g30 = at(addDays(d, -30)), peak = P.hist.reduce((m, x) => Math.max(m, x[1]), 0);
  if (g7 != null) rows.push({ r: g7, name: "You, 7 days ago", sub: "ghost", ghost: true });
  if (g30 != null && g30 !== g7) rows.push({ r: g30, name: "You, 30 days ago", sub: "ghost", ghost: true });
  if (peak > Math.round(P.r) + 5) rows.push({ r: peak, name: "You at your peak", sub: "ghost", ghost: true });
  rows.push({ r: 1000, name: "Starting line", sub: "everyone begins at 1000", ghost: true });
  rows.sort((a, b) => b.r - a.r);
  const wk = weekId(d), weeks = Object.entries(P.wk).filter(([k]) => k !== wk).sort().slice(-4);
  const league = allPlayers().map((x) => ({ name: x.name, xp: (x.doc.wk && x.doc.wk[wk]) || 0, me: x.me, ghost: false, r: x.doc.r }));
  for (const [k, xp] of weeks) league.push({ name: `You, week ${k.split("-W")[1]}`, xp, ghost: true, r: P.r });
  league.sort((a, b) => b.xp - a.xp);
  const solo = Object.keys(others).filter((id) => id !== UID).length === 0;
  return [
    h("h2", { text: "Rating ladder" }),
    h("div", { class: "card ladder" }, rows.map((x, i) => lrow(i + 1, x.r, x.name, x.sub, Math.round(x.r), x.me, x.ghost))),
    h("h2", { text: `Weekly league · ${wk}` }),
    h("div", { class: "card ladder" }, league.map((x, i) => lrow(i + 1, x.r, x.name, x.ghost ? "ghost week" : "this week", `${x.xp} XP`, x.me, x.ghost))),
    h("p", { class: "note", text: solo ? "Right now you race your own ghosts. Share this page with a friend: everyone who opens it gets a rating and appears on this ladder." :
      "Everyone who opens this page shares the same puzzles and the same rating system." }),
  ];
}

// ---- STATS ---------------------------------------------------------------------------------------------------------------
function renderStats() {
  const pts = [...P.hist]; if (!pts.length) pts.push([today(), Math.round(P.r)]);
  const W = 640, H = 150, lo = Math.min(...pts.map((x) => x[1]), 900) - 30, hi = Math.max(...pts.map((x) => x[1]), 1100) + 30;
  const x0 = dayNum(pts[0][0]), x1 = Math.max(x0 + 6, dayNum(pts[pts.length - 1][0]));
  const X = (dd) => 40 + ((dayNum(dd) - x0) / (x1 - x0)) * (W - 56), Y = (r) => 10 + (1 - (r - lo) / (hi - lo)) * (H - 30);
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Rating over time" });
  for (const [name, at] of TIERS) if (at > lo && at < hi) { svg.append(s("line", { x1: 40, x2: W - 10, y1: Y(at), y2: Y(at), stroke: "var(--line)", "stroke-dasharray": "3 4" }),
    s("text", { x: 36, y: Y(at) + 4, "text-anchor": "end", "font-size": 10, fill: "var(--muted)", "font-family": "IBM Plex Mono, monospace" }, String(at)),
    s("text", { x: 44, y: Y(at) - 4, "font-size": 10, fill: "var(--muted)", "font-family": "IBM Plex Mono, monospace" }, name)); }
  const path = pts.map((p2, i) => `${i ? "L" : "M"}${X(p2[0]).toFixed(1)},${Y(p2[1]).toFixed(1)}`).join(" ");
  if (pts.length > 1) svg.append(s("path", { d: `${path} L${X(pts[pts.length - 1][0])},${H - 20} L${X(pts[0][0])},${H - 20} Z`, fill: "var(--gold-soft)", opacity: 0.6 }));
  svg.append(s("path", { d: path, fill: "none", stroke: "var(--gold)", "stroke-width": 2.5, "stroke-linejoin": "round" }));
  const lp = pts[pts.length - 1]; svg.append(s("circle", { cx: X(lp[0]), cy: Y(lp[1]), r: 4.5, fill: "var(--gold)" }));
  const byLab = {};
  for (const [k, c] of Object.entries(META.concepts)) (byLab[c.lab] = byLab[c.lab] || []).push(k);
  const conceptRows = [];
  for (const lab of Object.keys(byLab).sort((a, b) => a - b)) {
    conceptRows.push(h("div", { class: "muted", style: "font:600 11px var(--display);letter-spacing:.1em;text-transform:uppercase;margin-top:10px", text: `Lab ${lab} · ${labName(+lab)}` }));
    for (const k of byLab[lab]) {
      const cc = P.cc[k] || [0, 0], acc = cc[0] ? cc[1] / cc[0] : 0, due = P.cards[k] && P.cards[k][1] <= dayNum(today());
      conceptRows.push(h("div", { class: "concept" },
        h("span", {}, META.concepts[k].name, due ? h("span", { class: "tag gold", style: "margin-left:6px", text: "review" }) : null),
        h("div", { class: "progress", title: `${Math.round(acc * 100)}% right` }, h("i", { style: `width:${Math.round(acc * 100)}%;background:${acc >= 0.8 ? "var(--good)" : acc >= 0.5 ? "var(--gold)" : "var(--bad)"}` })),
        h("span", { class: "num muted", style: "font-size:13px;text-align:right", text: cc[0] ? `${cc[1]}/${cc[0]}` : "–" }),
        h("button", { class: "link", onclick: () => startSession(k) }, "drill")));
    }
  }
  const weak = Object.entries(P.cc).filter(([, v]) => v[0] >= 3).sort((a, b) => a[1][1] / a[1][0] - b[1][1] / b[1][0]).slice(0, 3);
  return [
    h("h2", { text: "Rating" }),
    h("div", { class: "card wrap-x" }, svg),
    h("div", { class: "hud" },
      h("div", {}, h("small", { text: "Accuracy" }), h("b", { text: P.tried ? `${Math.round(100 * P.solved / P.tried)}%` : "–" })),
      h("div", {}, h("small", { text: "Total XP" }), h("b", { text: P.xp })),
      h("div", {}, h("small", { text: "Peak" }), h("b", { text: P.hist.reduce((m, x) => Math.max(m, x[1]), Math.round(P.r)) })),
      h("div", {}, h("small", { text: "Sessions" }), h("b", { text: P.sess.length }))),
    weak.length ? h("p", { class: "note", text: "Weakest right now: " + weak.map(([k, v]) => `${META.concepts[k].name} (${v[1]}/${v[0]})`).join(", ") + ". Tap drill to train one." }) : null,
    h("h2", { text: "Concepts" }),
    h("div", { class: "card" }, conceptRows),
    h("div", { class: "row" }, h("button", { class: "link", onclick: (e) => { muted = !muted; try { localStorage.setItem("c6tactics.mute", muted ? "1" : "0"); } catch {} e.currentTarget.textContent = muted ? "Sound: off" : "Sound: on"; } }, muted ? "Sound: off" : "Sound: on"),
      h("span", { class: "note grow", text: DB && UID ? "Saved to your account: same progress on every device." : "Offline mode: progress stays in this browser." })),
  ];
}

// ---- render + keys ---------------------------------------------------------------------------------------------------------
function render() {
  if (!P) return;
  const v = view();
  const content = v === "rush" ? renderRush() : v === "ladder" ? renderLadder() : v === "stats" ? renderStats() : (SESS ? renderSession() : renderHome());
  $("#app").replaceChildren(...[content].flat().filter(Boolean));
  renderHeader();
  if (v === "ladder" && USER) resolveNames();
}
async function resolveNames() {
  const ids = Object.keys(others).filter((id) => id !== UID); if (!ids.length) return;
  try { const ps = await USER.profiles(ids); let changed = false; for (const id of ids) { const n = ps[id] && ps[id].name || "Someone"; if (NAMES[id] !== n) { NAMES[id] = n; changed = true; } } if (changed && view() === "ladder") render(); } catch {}
}
window.addEventListener("hashchange", render);
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const S = view() === "rush" ? RUSH : SESS; if (!S || S.done || !S.cur) return;
  if (/^[1-4]$/.test(e.key) && !S.cur.answered) { const b = document.querySelector(`.choice[data-k="${e.key}"]`); if (b) b.click(); }
  else if (e.key === "Enter" && S.cur.answered) { const b = $("#nextBtn"); if (b) b.click(); }
});

// ---- boot -----------------------------------------------------------------------------------------------------------------
async function boot() {
  try { const res = await fetch("puzzles.json"); const data = await res.json(); PZ = data.puzzles; META = data.meta; }
  catch { $("#app").replaceChildren(h("div", { class: "card" }, h("p", { class: "q", text: "The puzzle pack didn't load. Reload the page to try again." }))); return; }
  for (const p of PZ) BYID[p.id] = p;
  try { const loc = JSON.parse(localStorage.getItem(LS) || "null"); if (loc && loc.v === 1) P = loc; } catch {}
  P = P || newPlayer();
  render();
  timerId = setInterval(tick, 500);
  const use = window.claude && window.claude.use ? (n) => window.claude.use(n).catch(() => null) : async () => null;
  const [db, user, sample] = await Promise.all([use("db"), use("user"), use("sample")]);
  USER = user; SAMPLE = sample;
  if (db && user) {
    const id = await user.id();
    if (id) {
      DB = db; UID = id;
      try { const c = await db.doc("course/current").get(); if (c.exists && c.data().lab) LAB = c.data().lab; } catch {}
      try {
        const mine = await db.doc("players/" + id).get();
        if (mine.exists) { const doc = mine.data(); if (!P.upd || (doc.upd || 0) >= P.upd || P.tried === 0) P = JSON.parse(JSON.stringify(doc)); else save(); }
        else save();
      } catch (e) { console.warn(e); }
      db.collection("players").onSnapshot((snap) => { others = {}; for (const d of snap.docs) if (d.exists) others[d.id] = d.data(); if (view() === "ladder" || (view() === "rush" && !RUSH)) render(); }, () => {});
    }
  }
  render();
}
boot();
</script>
